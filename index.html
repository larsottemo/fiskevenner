<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FangstScore Hybrid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --green: #22c55e;
      --yellow: #eab308;
      --orange: #f97316;
      --red: #ef4444;
      --blue: #38bdf8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 14px 40px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 1.7rem; font-weight: 700; }
    header p { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .time-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .time-label { font-size: 1.05rem; font-weight: 600; }
    .score-circle {
      width: 54px; height: 54px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 700;
      border: 3px solid;
    }
    .kategori {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .cat-svært-bra { background: rgba(34,197,94,0.15); color: var(--green); }
    .cat-bra { background: rgba(234,179,8,0.15); color: var(--yellow); }
    .cat-middels { background: rgba(249,115,22,0.15); color: var(--orange); }
    .cat-dårlig { background: rgba(239,68,68,0.15); color: var(--red); }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .meta span { color: var(--text); font-weight: 500; }

    .grunnlag {
      margin-top: 20px;
      padding: 14px;
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .grunnlag strong { color: var(--text); }

    .loading, .error {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
    }
    .error { color: var(--red); }

    .refresh {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: rgba(56,189,248,0.15);
      color: var(--blue);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>FangstScore</h1>
      <p>Hybrid – observasjon + prognose</p>
    </header>

    <div id="app">
      <div class="loading">Henter data...</div>
    </div>

    <footer>
      Data fra MET Frost + Locationforecast
    </footer>
  </div>

  <script>
    const WORKER_URL = "https://fangst-hybrid.lars-ottemo.workers.dev";

    async function load() {
      const app = document.getElementById("app");
      app.innerHTML = `<div class="loading">Henter data...</div>`;

      try {
        const res = await fetch(WORKER_URL + "?t=" + Date.now());
        if (!res.ok) throw new Error("Kunne ikke hente data (" + res.status + ")");
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        render(data);
      } catch (err) {
        app.innerHTML = `
          <div class="card">
            <div class="error">Noe gikk galt<br><small>${err.message}</small></div>
            <button class="refresh" onclick="load()">Prøv igjen</button>
          </div>`;
      }
    }

    function catClass(k) {
      if (k === "Svært bra") return "cat-svært-bra";
      if (k === "Bra") return "cat-bra";
      if (k === "Middels") return "cat-middels";
      return "cat-dårlig";
    }

    function scoreColor(k) {
      if (k === "Svært bra") return "var(--green)";
      if (k === "Bra") return "var(--yellow)";
      if (k === "Middels") return "var(--orange)";
      return "var(--red)";
    }

    function card(item) {
      if (!item) return "";
      const color = scoreColor(item.kategori);
      return `
        <div class="card">
          <div class="time-header">
            <div class="time-label">${item.label}</div>
            <div class="score-circle" style="border-color:${color}; color:${color}">
              ${item.score}
            </div>
          </div>
          <div class="kategori ${catClass(item.kategori)}">${item.kategori}</div>
          <div class="meta">
            <div>Fiskbarhet: <span>${item.fiskbarhet || "–"}</span></div>
            <div>Vind i tidsrom: <span>${item.vind_i_tidsrom ?? "–"} m/s</span></div>
          </div>
        </div>
      `;
    }

    function render(data) {
      document.getElementById("app").innerHTML = `
        ${card(data.naa)}
        ${card(data.om12timer)}
        ${card(data.iMorgenKveld)}
        ${card(data.overimorgenKveld)}

        <div class="grunnlag">
          <strong>Grunnlag (observasjoner)</strong><br>
          Nedbør 4 dager: ${data.grunnlag?.nedbor_4d ?? "–"} mm<br>
          Vind snitt 4 dager: ${data.grunnlag?.vind_snitt_4d ?? "–"} m/s<br>
          Trykk snitt 4 dager: ${data.grunnlag?.trykk_snitt_4d ?? "–"} hPa<br>
          Siste temperatur: ${data.grunnlag?.temperatur_siste ?? "–"} °C
        </div>

        <button class="refresh" onclick="load()">Oppdater</button>
      `;
    }

    load();
  </script>
</body>
</html>
